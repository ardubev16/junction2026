[project]
name = "wikicross"
version = "0.1.0"
description = "Where the language editions of a Wikipedia article state things differently: MariaDB Vector, no LLM in detection"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Lorenzo Bevilacqua", email = "43483037+ardubev16@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "modal>=1.6.4",
    "numpy>=2.5.4",
    "opentelemetry-api>=1.45.2",
    "pymysql>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
wikicross = "wikicross:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "viztracer>=1.1.1",
]
otel = [
    "opentelemetry-distro>=0.66b2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-instrumentation-pymysql>=0.66b2",
]
