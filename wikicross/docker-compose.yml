services:
  mariadb:
    image: mariadb:lts
    environment:
      MARIADB_ROOT_PASSWORD: wikicross
      MARIADB_DATABASE: wikicross
      MARIADB_USER: wikicross
      MARIADB_PASSWORD: wikicross
    command: --max-allowed-packet=256M
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - wikicross-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  # The public deployment: `COMPOSE_PROFILES=deploy`, `DOMAIN=…` and `ALLOWED_IPS=…` in .env, then `docker compose up -d`.
  app:
    build: .
    profiles: [deploy]
    env_file: .env
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      # Exempt from the rate limit. Not private ranges: over IPv6, Docker's proxy hands Caddy a private address.
      ALLOWED_IPS: ${ALLOWED_IPS:-127.0.0.1 ::1}
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    profiles: [deploy]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  wikicross-data:
  caddy-data:
  caddy-config:
