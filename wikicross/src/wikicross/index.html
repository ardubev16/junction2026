<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WikiCross — cross-language discrepancies</title>
<style>
  :root { --link: #36c; --border: #c8ccd1; --muted: #54595d; --chip: #eaecf0; --warn: #a66200; --bad: #d33; --serif: "Linux Libertine", "Georgia", "Times", serif; }
  body { margin: 0; background: #f8f9fa; color: #202122; font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Lato, "Helvetica Neue", Arial, sans-serif; }
  /* Name left, search centred on the page, AI toggle right; stacked on narrow screens. */
  header { background: #fff; border-bottom: 1px solid var(--border); padding: .6rem 1.5rem; display: grid;
           grid-template-columns: 1fr minmax(0, 640px) 1fr; gap: 1.5rem; align-items: center; }
  @media (max-width: 860px) { header { grid-template-columns: 1fr; gap: .6rem; } }
  .wordmark { font-family: var(--serif); font-size: 1.5rem; white-space: nowrap; display: inline-flex; gap: .45rem; align-items: center; }
  .logo { width: 1.6rem; height: 1.6rem; flex: none; }
  form { display: flex; }
  form input { flex: 1; padding: .45rem .6rem; font-size: 1rem; border: 1px solid #a2a9b1; border-radius: 2px 0 0 2px; }
  .toggle { display: inline-flex; gap: .4rem; align-items: center; font-size: .9rem; cursor: pointer; justify-self: end; }
  main { max-width: 1000px; margin: 0 auto; padding: .5rem 1.5rem 3rem; }
  h1, h2 { font-family: var(--serif); font-weight: normal; }
  h1 { font-size: 1.9rem; margin: 1rem 0 .3rem; border-bottom: 1px solid #a2a9b1; }
  a { color: var(--link); text-decoration: none; } a:hover { text-decoration: underline; }
  .muted { color: var(--muted); }
  .editions { position: relative; font-size: .9rem; margin-bottom: 1rem; }
  .editions summary { cursor: pointer; color: var(--link); width: fit-content; }
  .editions .langs { position: absolute; z-index: 10; margin-top: .3rem; width: min(900px, 90vw); max-height: 60vh; overflow: auto;
                     columns: 14em; column-gap: 1.5rem; background: #fff; border: 1px solid var(--border); border-radius: 2px;
                     padding: .6rem .9rem; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
  .editions .langs a { display: block; break-inside: avoid; padding: .1rem 0; }
  .editions .langs b { color: #202122; font-weight: normal; }
  .icon { width: 1.1em; height: 1.1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; flex: none; }
  .btn { display: inline-flex; gap: .4rem; align-items: center; font: bold .9rem sans-serif; padding: .4rem .8rem; border-radius: 2px;
         border: 1px solid #a2a9b1; background: #f8f9fa; color: #202122; cursor: pointer; }
  .btn.primary { background: var(--link); border-color: var(--link); color: #fff; }
  .btn.small { font-size: .8rem; padding: .15rem .5rem; }
  .btn:disabled { opacity: .5; cursor: default; }
  form .btn { border-radius: 0 2px 2px 0; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 2px; padding: 1rem 1.2rem; margin: 1rem 0; }
  .card.dismissed { opacity: .6; }
  /* Findings the AI check finds no contradiction in: header, title and verdict only, until reopened. */
  .card.collapsed .quotes, .card.collapsed .tools, .card.collapsed .summary { display: none; }
  .card.collapsed h3 { font-size: 1rem; }
  .meta { display: flex; justify-content: space-between; gap: 1rem; align-items: center; font-size: .85rem; flex-wrap: wrap; }
  .meta .pair { display: inline-flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
  .chip { background: var(--chip); border-radius: 2px; padding: .1rem .45rem; }
  .score { color: var(--warn); font-weight: bold; white-space: nowrap; display: inline-flex; gap: .3rem; align-items: center; }
  /* Keep in sync with extension/content.js: a discrepancy (facts disagree) is red, impartiality (tone,
     wording, certainty) amber. */
  .tag { font: bold .7rem/1.4 sans-serif; text-transform: uppercase; letter-spacing: .05em; color: #fff; border-radius: 2px; padding: 0 .4rem; }
  .tag.discrepancy { background: var(--bad); } .tag.impartiality { background: var(--warn); }
  .card.discrepancy { border-left: 4px solid var(--bad); } .card.impartiality { border-left: 4px solid var(--warn); }
  .card.discrepancy .score { color: var(--bad); }
  .card h3 { font-size: 1.25rem; margin: .5rem 0 .2rem; }
  .summary { font-family: var(--serif); font-size: 1rem; line-height: 1.6; margin: 0 0 .8rem; }
  .summary:empty { display: none; }
  .pending { color: var(--muted); font-style: italic; }
  /* Keep in sync with the spinner in extension/content.js. */
  .spinner { display: inline-block; width: 1em; height: 1em; border: 2px solid var(--chip); border-top-color: var(--link); border-radius: 50%;
             animation: spin .8s linear infinite; vertical-align: -.15em; margin-right: .4em; flex: none; }
  .btn.primary .spinner { border-color: rgba(255, 255, 255, .4); border-top-color: #fff; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
  .loading { display: flex; gap: 1rem; align-items: center; margin: 2rem 0; }
  .loading .spinner { width: 2.2rem; height: 2.2rem; border-width: 3px; }
  .loading .stage { font-size: 1.1rem; }
  .error { color: #d33; }
  .tools { display: flex; gap: .5rem; margin-top: .6rem; flex-wrap: wrap; }
  .quotes { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; margin-top: .8rem; }
  .quote h4 { margin: 0 0 .3rem; font-size: .85rem; font-weight: normal; display: flex; justify-content: space-between; gap: .5rem; align-items: center; }
  .quote blockquote { margin: 0; padding: .5rem .8rem; border-left: 4px solid var(--chip); font-family: var(--serif); white-space: pre-wrap; }
  .context { color: var(--muted); }
  .section { color: var(--muted); font: bold .8rem sans-serif; }
  .expand { display: flex; width: 100%; gap: .3rem; align-items: center; justify-content: center; font: .8rem sans-serif; color: var(--link);
            background: #eaf3ff; border: 0; padding: .1rem; cursor: pointer; }
  .expand:hover { background: #d5e6ff; }
  .expand:disabled { opacity: .5; cursor: default; }
  mark { background: #fef6e7; border-bottom: 2px solid #edab00; padding: 0 1px; }
  .quote.outlier blockquote { border-left-color: var(--warn); }
</style>
</head>
<body>
<header>
  <div class="wordmark">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="#36c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M19 11.5A8 8 0 1 0 11.5 19"/>
      <path d="M4.6 7.2A8 8 0 0 1 18.6 8.6l-2.2.5-1.3-1.5-1.7 1.4-1.3-1.1-1.6 2.1.8 1.8-1.7 1.5-2-.8-1.3 2.4-2.2-1.1z" fill="#36c" stroke="none"/>
      <circle cx="15.8" cy="15.8" r="3.3"/><path d="m18.3 18.3 2.9 2.9"/>
    </svg>WikiCross
  </div>
  <form id="f">
    <input type="search" id="q" list="titles" placeholder="Search an article: Talvisota, Winter War, Stepan Bandera…" autocomplete="off" required>
    <datalist id="titles"></datalist>
    <button class="btn primary">Compare</button>
  </form>
  <label class="toggle" title="Check each pair with an LLM, summarise it, and allow English translation"><input type="checkbox" id="ai"> AI summaries</label>
</header>
<main id="out"><p class="muted">Pick an article to see where its Latin- and Cyrillic-script Wikipedia editions state different facts.</p></main>

<script>
const DISPLAY = new Intl.DisplayNames(["en"], { type: "language" });
const langName = (code) => { try { return DISPLAY.of(code); } catch { return code; } };
const SHOWN = 4;  // quotes per card before "Show all"
const $ = (tag, attrs = {}, ...kids) => {
  const el = Object.assign(document.createElement(tag), attrs);
  el.append(...kids);
  return el;
};
// Icons are drawn here, not taken from a font: fonts without these glyphs showed empty squares.
// innerHTML only ever sees these constant strings.
const ICONS = {
  alert: '<path d="M10 2.5 18.5 17.5h-17z"/><path d="M10 8v4M10 14.8v.2"/>',
  pair: '<path d="M2 10h16M5 7l-3 3 3 3M15 7l3 3-3 3"/>',
  scale: '<path d="M10 3v14M6 17h8M3 6h14M5.5 6 3 12h5zM14.5 6 12 12h5z"/>',
  chevron: '<path d="m5 8 5 5 5-5"/>',
  up: '<path d="m5 12 5-5 5 5"/>',
  copy: '<rect x="7" y="7" width="10" height="11" rx="1"/><path d="M13 7V3H3v11h4"/>',
  check: '<path d="m4 10 4 4 8-8"/>',
};
const icon = (name) => {
  const t = document.createElement("template");
  t.innerHTML = `<svg class="icon" viewBox="0 0 20 20" aria-hidden="true">${ICONS[name]}</svg>`;
  return t.content.firstChild;
};
const spinner = () => $("span", { className: "spinner", ariaHidden: "true" });
const q = document.getElementById("q"), out = document.getElementById("out"), ai = document.getElementById("ai");
const post = async (url, body) => {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok) throw new Error(data.detail);
  return data;
};

// Text with every highlighted phrase wrapped in <mark>…</mark>, as a string (sent to the translator).
const withMarks = (text, phrases = []) =>
  [...new Set(phrases)].reduce((t, p) => t.split(p).join(`<mark>${p}</mark>`), text);
// That string as DOM nodes; never innerHTML, so article text cannot inject markup.
const marked = (s) => {
  let inMark = false;
  return s.split(/(<\/?mark>)/).flatMap((piece) => {
    if (piece === "<mark>" || piece === "</mark>") { inMark = piece === "<mark>"; return []; }
    return piece ? [inMark ? $("mark", { textContent: piece }) : piece] : [];
  });
};

let timer;
q.addEventListener("input", () => {
  clearTimeout(timer);
  if (q.value.length < 2) return;
  timer = setTimeout(async () => {
    const r = await fetch(`/api/titles?q=${encodeURIComponent(q.value)}`);
    document.getElementById("titles").replaceChildren(
      ...(await r.json()).map((t) => $("option", { value: t.title, label: t.lang })));
  }, 200);
});

// The query lives in the URL (?title=…) so results can be shared and Back/Forward work. The title is
// only ever put into input.value, textContent and URLSearchParams: never parsed as HTML.
let current = 0, shown = null;
async function search(title, push) {
  if (push) history.pushState(null, "", `?${new URLSearchParams({ title })}`);
  q.value = title;
  document.title = `${title} — WikiCross`;
  const mine = ++current;  // a slower, older search must not overwrite a newer one
  shown = null;
  // Loading view: the server's current stage (fetching editions, embedding, comparing), polled each
  // second, and the time so far. Only the stage is announced to screen readers, not every second.
  const stage = $("span", { textContent: "Looking the topic up…" }), seconds = $("span", { className: "muted", ariaHidden: "true" });
  out.replaceChildren($("div", { className: "loading" }, spinner(),
    $("div", {}, $("div", { className: "stage", role: "status" }, stage, " ", seconds),
      $("div", { className: "muted", textContent: "The first time a topic is asked for, its Latin- and Cyrillic-script editions are fetched from Wikipedia and embedded: this may take a few minutes." }))));
  const poll = setInterval(async () => {
    try {
      const p = await (await fetch(`/api/progress?${new URLSearchParams({ title })}`)).json();
      if (mine !== current || !p.stage) return;
      if (stage.textContent !== `${p.stage}…`) stage.textContent = `${p.stage}…`;
      seconds.textContent = `${p.seconds} s`;
    } catch { /* the result itself reports errors */ }
  }, 1000);
  let r, data;
  try {
    r = await fetch(`/api/diff?${new URLSearchParams({ title, limit: 15 })}`);
    data = await r.json().catch(() => ({ detail: `Server error ${r.status}` }));
  } catch (err) {
    data = { detail: `WikiCross server not reachable: ${err.message}` };
  } finally {
    clearInterval(poll);
  }
  if (mine !== current) return;
  if (!r?.ok) { out.replaceChildren($("p", { className: "error", textContent: data.detail })); return; }
  shown = data;
  render(data);
}
const fromUrl = () => new URLSearchParams(location.search).get("title")?.trim();

document.getElementById("f").addEventListener("submit", (e) => {
  e.preventDefault();
  const title = q.value.trim();
  if (title) search(title, title !== fromUrl());
});
window.addEventListener("popstate", () => { const t = fromUrl(); if (t) search(t, false); });
ai.addEventListener("change", () => shown && render(shown));
if (fromUrl()) search(fromUrl(), false);

// Every edition, folded into a menu: a topic can have dozens. Each link opens that edition.
function editionsMenu(articles) {
  return $("details", { className: "editions" },
    $("summary", { textContent: `${articles.length} editions` }),
    $("div", { className: "langs" }, ...articles.map((a) => $("a", { href: /^https?:\/\//.test(a.url) ? a.url : "#", target: "_blank", rel: "noopener" },
      $("b", { textContent: `${langName(a.lang)} (${a.lang})` }), ` · ${a.title}`))));
}

function render(data) {
  const head = data.articles.find((a) => a.lang === "en") || data.articles[0];
  out.replaceChildren(
    $("h1", { textContent: head.title }),
    editionsMenu(data.articles),
    ...(data.differences.length ? [$("h2", { textContent: `${data.differences.length} differences` }), ...data.differences.map(card)]
      : [$("p", { className: "muted", textContent: "The editions state nothing differently that WikiCross can find." })]));
}

const getContext = async (params) => {
  const r = await fetch(`/api/context?${new URLSearchParams(params)}`);
  const data = await r.json();
  if (!r.ok) throw new Error(data.detail);
  return data;
};

// Paragraph view only ("Show paragraphs"), and only in the web app: when a quote's whole passage is
// not enough context, it expands up and down through the article, a few sentences per click, like
// the folded lines of a GitHub diff. Context is muted; a new passage starts a new line, a new section
// shows its heading. `ctx` outlives re-renders of the card; `quote()` gives fresh nodes for the passage.
const STEP = 3;
const contextOf = (m) => ({ before: [], after: [], top: [m.seq, 0], bottom: [m.seq, 65535], end: {}, busy: false, error: "" });
function expandable(m, ctx, quote) {
  const wrap = $("div", { className: "expandable" });
  const button = (dir) => {
    if (ctx.end[dir]) return "";
    const b = $("button", { className: "expand", type: "button", disabled: ctx.busy, title: `Show ${STEP} more sentences ${dir === "up" ? "above" : "below"}` },
      icon(dir === "up" ? "up" : "chevron"), dir === "up" ? "Expand up" : "Expand down");
    b.addEventListener("click", async () => {
      ctx.busy = true; draw();
      const [seq, n] = dir === "up" ? ctx.top : ctx.bottom;
      try {
        const rows = await getContext({ lang: m.lang, page_id: m.page_id, seq, n, direction: dir, count: STEP });
        if (rows.length) {
          if (dir === "up") { ctx.before.unshift(...rows); ctx.top = [rows[0].seq, rows[0].n]; }
          else { ctx.after.push(...rows); ctx.bottom = [rows.at(-1).seq, rows.at(-1).n]; }
        }
        ctx.end[dir] = rows.length < STEP;
        ctx.error = "";
      } catch (err) { ctx.error = `Could not load more: ${err.message}`; }
      ctx.busy = false; draw();
    });
    return b;
  };
  const draw = () => {
    const segments = [...ctx.before.map((r) => ({ ...r, nodes: [r.text] })), { seq: m.seq, heading: m.heading, nodes: quote(), quote: true },
      ...ctx.after.map((r) => ({ ...r, nodes: [r.text] }))];
    const body = $("blockquote", {});
    segments.forEach((s, i) => {
      const prev = segments[i - 1];
      if (prev && s.heading !== prev.heading) body.append("\n", $("span", { className: "section", textContent: `§ ${s.heading || "(intro)"}` }), "\n");
      else if (prev) body.append(s.seq !== prev.seq ? "\n" : " ");
      body.append($("span", { className: s.quote ? "quoted" : "context" }, ...s.nodes));
    });
    wrap.replaceChildren(button("up"), body, button("down"), ctx.error ? $("p", { className: "error", textContent: ctx.error }) : "");
  };
  draw();
  return wrap;
}

function card(finding) {
  const names = (langs) => langs.length > 3 ? `the ${langs.length} other` : langs.map(langName).join(" and ");
  const state = { highlights: {}, english: null, showEnglish: false, context: false, all: false,
                  ctx: Object.fromEntries(finding.members.map((m) => [m.lang, contextOf(m)])) };
  const others = finding.members.map((m) => m.lang).filter((l) => l !== finding.lang);
  const toward = finding.deviation > 0 ? finding.ends[0] : finding.ends[1];
  const than = others.length > 3 ? names(others) : `the ${names(others)}`;
  const title = $("h3", { textContent: `The ${langName(finding.lang)} edition ${toward} than ${than} edition${others.length > 1 ? "s" : ""}.` });
  const outliers = finding.outlier ? [finding.lang] : [];
  const label = $("span", { className: "score" }, $("span", { className: "tag impartiality", textContent: "Impartiality" }), icon("scale"),
    `${finding.outlier ? `Outlier: ${langName(finding.lang)}` : "Different framing"} · ${Math.abs(finding.deviation).toFixed(1)}σ`);
  // Outliers first, then the API's order; a card shows the first SHOWN unless expanded.
  const members = [...finding.members.filter((m) => outliers.includes(m.lang)), ...finding.members.filter((m) => !outliers.includes(m.lang))];
  const first = members.slice(0, SHOWN);
  const summary = $("p", { className: "summary" });
  const verdict = $("p", { className: "summary" });  // AI only; empty and hidden otherwise
  const quotes = $("div", { className: "quotes" });
  const article = $("article", { className: "card impartiality" });
  const quoteOf = (p) => p.sentence;

  const more = members.length > SHOWN ? $("button", { className: "btn small", type: "button" }) : null;
  const renderQuotes = () => {
    const pool = members;
    if (more) {
      more.hidden = pool.length <= SHOWN;
      more.replaceChildren(state.all ? "Show fewer" : `Show all ${pool.length} editions`, icon("chevron"));
    }
    quotes.replaceChildren(...(state.all ? pool : pool.slice(0, SHOWN)).map((p) => {
    const en = state.showEnglish && state.english && p.lang in state.english;
    const heading = (en ? state.english[`${p.lang}-heading`] : p.heading) || "(intro)";
    // In English, the translated quote alone; the passage and its context are in the original language.
    const quote = en ? $("blockquote", {}, $("span", { className: "quoted" }, ...marked(state.english[p.lang])))
      : state.context && p.sentence ? expandable(p, state.ctx[p.lang], () => marked(withMarks(p.text, [p.sentence])))
      : $("blockquote", {}, $("span", { className: "quoted" }, ...marked(withMarks(quoteOf(p), state.highlights[p.lang]))));
    const copy = $("button", { className: "btn small", type: "button", title: "Copy this quote" }, icon("copy"), "Copy");
    copy.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(quote.querySelector(".quoted").textContent); copy.replaceChildren(icon("check"), "Copied"); }
      catch { copy.replaceChildren(icon("copy"), "Copy failed"); }
      setTimeout(() => copy.replaceChildren(icon("copy"), "Copy"), 1500);
    });
    return $("div", { className: outliers.includes(p.lang) ? "quote outlier" : "quote" },
      $("h4", {}, $("span", { className: "chip" }, $("b", { textContent: `${p.lang}.wikipedia` }), ` ${p.title} § ${heading}`), copy),
      quote);
    }));
  };
  renderQuotes();

  const tools = $("div", { className: "tools" });
  if (more) {
    more.addEventListener("click", () => { state.all = !state.all; renderQuotes(); });
    tools.append(more);
  }
  if (members[0].sentence) {
    const context = $("button", { className: "btn small", type: "button" }, "Show paragraphs", icon("chevron"));
    context.addEventListener("click", () => {
      state.context = !state.context;
      context.replaceChildren(state.context ? "Show sentences" : "Show paragraphs", icon(state.context ? "up" : "chevron"));
      renderQuotes();
    });
    tools.append(context);
  }
  if (ai.checked) {
    const toggle = $("button", { className: "btn small primary", type: "button", disabled: true, textContent: "View quotes in English" });
    verdict.className = "pending";
    verdict.replaceChildren(spinner(), "Checking with AI…");
    post("/api/explain", { passages: first.map(({ lang, heading, text }) => ({ lang, heading, text })) })
      .then((x) => {
        verdict.className = "muted";
        verdict.textContent = x.discrepancy ? `AI: ${x.title}` : "AI: no clear difference in tone or framing.";
        if (!x.discrepancy) {
          article.classList.add("dismissed", "collapsed");
          const reopen = $("button", { className: "btn small", type: "button", ariaExpanded: "false" }, "Show anyway", icon("chevron"));
          reopen.addEventListener("click", () => {
            const open = !article.classList.toggle("collapsed");
            reopen.ariaExpanded = String(open);
            reopen.replaceChildren(open ? "Collapse" : "Show anyway", icon(open ? "up" : "chevron"));
          });
          verdict.append(" ", reopen);
        }
        summary.textContent = x.summary;
        for (const [lang, phrases] of Object.entries(x.highlights)) state.highlights[lang] = [...(state.highlights[lang] || []), ...phrases];
        renderQuotes();
      })
      .catch((err) => { verdict.className = "error"; verdict.textContent = `AI check unavailable: ${err.message}`; })
      .finally(() => { toggle.disabled = false; });
    toggle.addEventListener("click", async () => {
      if (!state.english && !state.showEnglish) {
        toggle.disabled = true; toggle.replaceChildren(spinner(), "Translating…");
        const texts = {};
        for (const p of first) {
          texts[p.lang] = withMarks(quoteOf(p), state.highlights[p.lang]);
          if (p.heading) texts[`${p.lang}-heading`] = p.heading;
        }
        try { state.english = await post("/api/translate", { texts, target: "en" }); }
        catch (err) { toggle.disabled = false; toggle.textContent = `Translation failed (${err.message}): retry`; return; }
        toggle.disabled = false;
      }
      state.showEnglish = !state.showEnglish;
      toggle.textContent = state.showEnglish ? "View original quotes" : "View quotes in English";
      renderQuotes();
    });
    tools.append(toggle);
  }

  article.append(
    $("div", { className: "meta" },
      $("span", { className: "pair" }, ...first.flatMap((m, i) => [
        i ? icon("pair") : "",
        $("span", { className: "chip" }, $("b", { textContent: `${m.lang}.wikipedia` }), ` § ${m.heading || "(intro)"}`)]),
        members.length > SHOWN ? ` + ${members.length - SHOWN} more` : ""),
      label),
    title, verdict, summary, quotes, tools);
  return article;
}
</script>
</body>
</html>
