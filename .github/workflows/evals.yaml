name: Evals

# The decision model's verdicts, the AI's explanations and bge-m3's distances on the labelled findings in
# evals/ (src/wikicross/evals.py). They need the models and Modal: set the secrets DECISION_API_KEY,
# LLM_API_KEY, MODAL_TOKEN_ID, MODAL_TOKEN_SECRET and the variables LLM_API_TYPE, LLM_URL, LLM_MODEL
# (Settings → Secrets and variables → Actions); an eval whose secret is missing skips with a notice.
# Weekly too: a provider's model can change under the same name.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - src/wikicross/app.py
      - src/wikicross/compare.py
      - src/wikicross/llm.py
      - src/wikicross/decide.py
      - src/wikicross/evals.py
      - evals/**

permissions:
  contents: read

# The app's settings require every model's; an eval without its own secret is skipped, so a placeholder
# lets the others start.
env:
  LLM_API_TYPE: ${{ vars.LLM_API_TYPE || 'openai' }}
  LLM_URL: ${{ vars.LLM_URL || 'http://llm.invalid/v1' }}
  LLM_MODEL: ${{ vars.LLM_MODEL || 'none' }}
  LLM_API_KEY: ${{ secrets.LLM_API_KEY || 'none' }}
  DECISION_API_KEY: ${{ secrets.DECISION_API_KEY || 'none' }}

jobs:
  models:
    runs-on: ubuntu-latest
    services:
      mariadb: # the LLM answers' cache table; empty, so every answer is fresh
        image: mariadb:lts
        env:
          MARIADB_ROOT_PASSWORD: wikicross
          MARIADB_DATABASE: wikicross
          MARIADB_USER: wikicross
          MARIADB_PASSWORD: wikicross
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-retries 30
    env:
      DB_PORT: 3306
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Decision model on the labelled findings
        run: |
          if [ "$DECISION_API_KEY" = none ]; then echo "::notice::DECISION_API_KEY not set: skipped"; exit 0; fi
          uv run python -m wikicross.evals decide
      - name: Explanations of the labelled findings
        if: ${{ !cancelled() }}
        run: |
          if [ "$LLM_API_KEY" = none ]; then echo "::notice::LLM_API_KEY not set: explain eval skipped"; exit 0; fi
          uv run python -m wikicross.evals explain

  embeddings:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: bge-m3 distances of the labelled findings
        run: |
          if [ -z "$MODAL_TOKEN_ID" ]; then
            echo "::notice::MODAL_TOKEN_ID not set: embeddings eval skipped"; exit 0
          fi
          uv run python -m wikicross.evals embeddings
