[project]
name = "langdiff"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lorenzo Bevilacqua", email = "43483037+ardubev16@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pyarrow>=26.0.1",
    "pymysql>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
langdiff = "langdiff:main"
langdiff-load = "langdiff:load"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
