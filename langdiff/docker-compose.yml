services:
  mariadb:
    image: mariadb:lts
    environment:
      MARIADB_ROOT_PASSWORD: langdiff
      MARIADB_DATABASE: langdiff
      MARIADB_USER: langdiff
      MARIADB_PASSWORD: langdiff
    command: --max-allowed-packet=256M
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - langdiff-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

volumes:
  langdiff-data:
