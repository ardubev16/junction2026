services:
  mariadb:
    image: mariadb:lts
    environment:
      MARIADB_ROOT_PASSWORD: wikicross
      MARIADB_DATABASE: wikicross
      MARIADB_USER: wikicross
      MARIADB_PASSWORD: wikicross
    command: --max-allowed-packet=256M
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - wikicross-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

volumes:
  wikicross-data:
