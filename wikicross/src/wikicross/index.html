<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WikiCross — cross-language discrepancies</title>
<style>
  :root { --link: #36c; --border: #c8ccd1; --muted: #54595d; --chip: #eaecf0; --warn: #a66200; --bad: #d33; --serif: "Linux Libertine", "Georgia", "Times", serif; }
  body { margin: 0; background: #f8f9fa; color: #202122; font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Lato, "Helvetica Neue", Arial, sans-serif; }
  /* Name left, search centred on the page; stacked on narrow screens. */
  header { background: #fff; border-bottom: 1px solid var(--border); padding: .6rem 1.5rem; display: grid;
           grid-template-columns: 1fr minmax(0, 640px) 1fr; gap: 1.5rem; align-items: center; }
  @media (max-width: 860px) { header { grid-template-columns: 1fr; gap: .6rem; } }
  .wordmark { font-family: var(--serif); font-size: 1.5rem; white-space: nowrap; display: inline-flex; gap: .45rem; align-items: center;
              color: inherit; justify-self: start; }
  .wordmark:hover { text-decoration: none; }
  .logo { width: 1.6rem; height: 1.6rem; flex: none; }
  form { display: flex; }
  form input { flex: 1; padding: .45rem .6rem; font-size: 1rem; border: 1px solid #a2a9b1; border-radius: 2px 0 0 2px; }
  /* Search suggestions, like Wikipedia's: thumbnail, title (the typed text underlined), short description. */
  .combo { position: relative; flex: 1; display: flex; }
  .suggestions { position: absolute; top: 100%; left: 0; right: 0; z-index: 30; margin: 0; padding: 0; list-style: none; background: #fff;
                 border: 1px solid #a2a9b1; border-top: 0; box-shadow: 0 4px 12px rgba(0,0,0,.15); max-height: 70vh; overflow: auto; }
  .suggestions li { display: flex; gap: .7rem; align-items: center; padding: .35rem .6rem; cursor: pointer; border-top: 1px solid #eaecf0; }
  .suggestions li[aria-selected="true"], .suggestions li:hover { background: #eaf3ff; }
  .suggestions .thumb { width: 56px; height: 56px; flex: none; border-radius: 2px; background: #eaecf0; color: #a2a9b1;
                        display: grid; place-items: center; overflow: hidden; }
  .suggestions .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .suggestions .thumb .icon { width: 28px; height: 28px; }
  .suggestions .text { min-width: 0; }
  .suggestions b { display: block; } .suggestions u { text-decoration-thickness: 2px; text-underline-offset: 2px; }
  .suggestions small { display: block; color: var(--muted); font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .suggestions .lang { font: bold .7rem sans-serif; color: var(--muted); border: 1px solid var(--border); border-radius: 2px;
                       padding: 0 .3rem; margin-left: .4rem; text-transform: uppercase; vertical-align: .1em; }
  .toggle { display: inline-flex; gap: .4rem; align-items: center; font-size: .9rem; cursor: pointer; }
  /* Filters above the findings: the language picker (a menu like the editions') and "Hide dialects". */
  .filters { display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
  .filters .editions { margin: 0; }
  .picker label { display: block; break-inside: avoid; padding: .1rem 0; cursor: pointer; }
  .picker .actions { column-span: all; display: flex; gap: .5rem; margin-bottom: .5rem; }
  main { max-width: 1000px; margin: 0 auto; padding: .5rem 1.5rem 3rem; }
  h1, h2 { font-family: var(--serif); font-weight: normal; }
  h1 { font-size: 1.9rem; margin: 0; }
  /* The page title with the editions menu on its right, on one ruled row. */
  .pagehead { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap;
              margin: 1rem 0 .6rem; border-bottom: 1px solid #a2a9b1; }
  .pagehead .editions { margin: 0; } .pagehead .editions .langs { right: 0; }
  a { color: var(--link); text-decoration: none; } a:hover { text-decoration: underline; }
  .muted { color: var(--muted); }
  [hidden] { display: none !important; }  /* .btn sets display, which would show hidden buttons */
  .editions { position: relative; font-size: .9rem; margin-bottom: 1rem; }
  .editions summary { cursor: pointer; color: var(--link); width: fit-content; }
  .editions .langs { position: absolute; z-index: 10; margin-top: .3rem; width: min(900px, 90vw); max-height: 60vh; overflow: auto;
                     columns: 14em; column-gap: 1.5rem; background: #fff; border: 1px solid var(--border); border-radius: 2px;
                     padding: .6rem .9rem; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
  .editions .langs a { display: block; break-inside: avoid; padding: .1rem 0; }
  .editions .langs b { color: #202122; font-weight: normal; }
  .icon { width: 1.1em; height: 1.1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; flex: none; }
  .btn { display: inline-flex; gap: .4rem; align-items: center; font: bold .9rem sans-serif; padding: .4rem .8rem; border-radius: 2px;
         border: 1px solid #a2a9b1; background: #f8f9fa; color: #202122; cursor: pointer; }
  .btn.primary { background: var(--link); border-color: var(--link); color: #fff; }
  .btn.small { font-size: .8rem; padding: .15rem .5rem; }
  .btn:disabled { opacity: .5; cursor: default; }
  form .btn { border-radius: 0 2px 2px 0; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 2px; padding: 1rem 1.2rem; margin: 1rem 0; }
  .verdict:empty { display: none; } .verdict { margin: 0 0 .6rem; }
  .reason { color: var(--muted); font-style: italic; }
  .irrelevant { border-top: 1px dashed var(--border); margin-top: 1rem; }
  .pager { display: flex; gap: 1rem; align-items: center; justify-content: center; margin: 1.5rem 0; }
  /* The "i" next to a finding's label: an icon in the label's colour, still a button for keyboards. */
  .info { all: unset; display: inline-flex; cursor: pointer; color: inherit; }
  .info:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 50%; }
  /* Its popover sits under the icon and scrolls with the page (anchor positioning); it flips if there is no room. */
  .numbers[popover] { position: absolute; inset: auto; margin: .4rem 0 0; position-area: bottom span-left;
                      position-try-fallbacks: flip-block, flip-inline; }
  /* The numbers popover: out of the label's bold, coloured, unwrapped text. */
  .numbers { max-width: 440px; padding: 1rem 1.2rem; border: 1px solid var(--border); border-radius: 2px; box-shadow: 0 4px 16px rgba(0,0,0,.2);
             color: #202122; font: .9rem/1.5 sans-serif; white-space: normal; }
  .numbers h4 { margin: 0 0 .5rem; } .numbers p { margin: .4rem 0; }
  .numbers table { border-collapse: collapse; margin: .4rem 0; } .numbers td { padding: .05rem 1rem .05rem 0; }
  .numbers td.num { text-align: right; font-variant-numeric: tabular-nums; } .numbers tr.this td { font-weight: bold; }
  .meta { display: flex; justify-content: space-between; gap: 1rem; align-items: center; font-size: .85rem; flex-wrap: wrap; position: relative; }
  /* The kind of difference the AI found, first thing on a card. Keep in sync with extension/content.js. */
  .kind { font: bold .75rem sans-serif; text-transform: uppercase; letter-spacing: .04em; padding: .2rem .55rem; border-radius: 2px; color: #fff; }
  .kind.factual { background: #d33; } .kind.bias { background: #8e44ad; } .kind.framing { background: #36c; }
  .kind.none { background: #72777d; }  /* marked irrelevant by the AI */
  .score { color: var(--warn); font-weight: bold; white-space: nowrap; display: inline-flex; gap: .3rem; align-items: center; margin-left: auto; }
  .card h3 { font-size: 1.25rem; margin: .5rem 0 .2rem; }
  .card h3.pending { font: italic 1rem sans-serif; color: var(--muted); }
  .summary { font-family: var(--serif); font-size: 1rem; line-height: 1.6; margin: 0 0 .8rem; }
  .summary:empty { display: none; }
  .pending { color: var(--muted); font-style: italic; }
  /* A quote's translate button: hovering or focusing it shows the other version, clicking swaps them. */
  .tr { position: relative; display: inline-flex; }
  .tr > button { all: unset; display: inline-flex; cursor: pointer; color: var(--link); padding: .1rem; border-radius: 2px; }
  .tr > button[aria-pressed="true"] { background: var(--chip); }
  .tr > button:focus-visible { outline: 2px solid var(--link); }
  .tr .tip { display: none; position: absolute; right: 0; bottom: 100%; z-index: 20; width: min(380px, 80vw); margin-bottom: .3rem;
             background: #fff; border: 1px solid var(--border); border-radius: 2px; box-shadow: 0 4px 12px rgba(0,0,0,.15);
             padding: .5rem .7rem; font: 1rem/1.5 var(--serif); white-space: pre-wrap; color: #202122; }
  .tr:hover .tip, .tr:focus-within .tip { display: block; }
  /* Keep in sync with the spinner in extension/content.js. */
  .spinner { display: inline-block; width: 1em; height: 1em; border: 2px solid var(--chip); border-top-color: var(--link); border-radius: 50%;
             animation: spin .8s linear infinite; vertical-align: -.15em; margin-right: .4em; flex: none; }
  .btn.primary .spinner { border-color: rgba(255, 255, 255, .4); border-top-color: #fff; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
  .loading { display: flex; gap: 1rem; align-items: center; margin: 2rem 0; }
  .loading .spinner { width: 2.2rem; height: 2.2rem; border-width: 3px; }
  .loading .stage { font-size: 1.1rem; }
  .error { color: #d33; }
  .tools { display: flex; gap: .5rem; margin-top: .6rem; flex-wrap: wrap; }
  .quotes { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; margin-top: .8rem; }
  /* Each quote a box: header, text, translate button. Rows from the subgrid: a finding's headers line up. */
  .quote { display: grid; grid-row: span 3; grid-template-rows: subgrid; row-gap: .4rem; border: 1px solid var(--border);
           border-radius: 2px; padding: .6rem .8rem; background: #fff; }
  .quote.outlier { background: #fdf4e6; border-color: #e8c48f; }
  .quote.linked { outline: 2px solid var(--hl-line); outline-offset: 1px; }
  .quote h4 { margin: 0; font-size: .85rem; font-weight: normal; display: flex; gap: .4rem; align-items: start; flex-wrap: wrap; }
  .quote h4 b { border-bottom: 3px solid var(--hl-line); }
  .quote blockquote { margin: 0; font-family: var(--serif); white-space: pre-wrap; }
  .quote .foot { display: flex; justify-content: flex-end; align-items: end; }
  .context { color: var(--muted); }
  .section { color: var(--muted); font: bold .8rem sans-serif; }
  .expand { display: flex; width: 100%; gap: .3rem; align-items: center; justify-content: center; font: .8rem sans-serif; color: var(--link);
            background: #eaf3ff; border: 0; padding: .1rem; cursor: pointer; }
  .expand:hover { background: #d5e6ff; }
  .expand:disabled { opacity: .5; cursor: default; }
  /* One colour per quote of a finding: its language name, its highlights, and the description's quotes of it. */
  .c0 { --hl: #e3ecfd; --hl-line: #36c; } .c1 { --hl: #dcf3e6; --hl-line: #14866d; }
  .c2 { --hl: #efe3f8; --hl-line: #8e44ad; } .c3 { --hl: #fde2dc; --hl-line: #c0392b; }
  mark { background: var(--hl, #fef6e7); border-bottom: 2px solid var(--hl-line, #edab00); padding: 0 1px; }
</style>
</head>
<body>
<header>
  <a class="wordmark" href="/" title="WikiCross home">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="#36c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M19 11.5A8 8 0 1 0 11.5 19"/>
      <path d="M4.6 7.2A8 8 0 0 1 18.6 8.6l-2.2.5-1.3-1.5-1.7 1.4-1.3-1.1-1.6 2.1.8 1.8-1.7 1.5-2-.8-1.3 2.4-2.2-1.1z" fill="#36c" stroke="none"/>
      <circle cx="15.8" cy="15.8" r="3.3"/><path d="m18.3 18.3 2.9 2.9"/>
    </svg>WikiCross
  </a>
  <form id="f" role="search">
    <div class="combo">
      <input type="search" id="q" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions"
             aria-label="Search an article" placeholder="Search an article: Talvisota, Winter War, Stepan Bandera…" autocomplete="off" required>
      <ul id="suggestions" class="suggestions" role="listbox" aria-label="Suggested articles" hidden></ul>
    </div>
    <button class="btn primary">Compare</button>
  </form>
</header>
<main id="out">
  <p class="muted">Pick an article to see where all its Wikipedia versions frame things differently.</p>
  <!-- Keep in sync with LIMITS in app.py. -->
  <p class="error">Fair use: outside the event network, each address can make 60 requests a minute, and 30 a minute
    for AI summaries and translations. Past that, wait a minute and try again.</p>
</main>

<script>
const DISPLAY = new Intl.DisplayNames(["en"], { type: "language" });
const langName = (code) => { try { return DISPLAY.of(code); } catch { return code; } };
const SHOWN = 3;  // quotes per card; the rest on "Show all"
const $ = (tag, attrs = {}, ...kids) => {
  const el = Object.assign(document.createElement(tag), attrs);
  el.append(...kids);
  return el;
};
// Icons are drawn here, not taken from a font: fonts without these glyphs showed empty squares.
// innerHTML only ever sees these constant strings.
const ICONS = {
  alert: '<path d="M10 2.5 18.5 17.5h-17z"/><path d="M10 8v4M10 14.8v.2"/>',
  chevron: '<path d="m5 8 5 5 5-5"/>',
  left: '<path d="m12 5-5 5 5 5"/>',
  right: '<path d="m8 5 5 5-5 5"/>',
  up: '<path d="m5 12 5-5 5 5"/>',
  link: '<path d="M11 3h6v6M17 3l-8 8M14 12v5H3V6h5"/>',
  list: '<path d="M7 5h10M7 10h10M7 15h10M3 5h.01M3 10h.01M3 15h.01"/>',
  article: '<path d="M5 2.5h10v15H5z"/><path d="M8 6.5h4M8 9.5h4M8 12.5h4"/>',
  paragraph: '<path d="M10 3v14M14 3v14M16 3H8.5a3.5 3.5 0 0 0 0 7H10"/>',
  translate: '<path d="M3 5h8M7 3v2M5 5c0 4 3 7 6 8M9 5c0 3-2 6-6 8M11 17l3.5-8 3.5 8M12.2 14.5h4.6"/>',
  eye: '<path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6z"/><circle cx="10" cy="10" r="2.5"/>',
  info: '<circle cx="10" cy="10" r="7.5"/><path d="M10 9v5M10 6.2v.1"/>',
};
const icon = (name) => {
  const t = document.createElement("template");
  t.innerHTML = `<svg class="icon" viewBox="0 0 20 20" aria-hidden="true">${ICONS[name]}</svg>`;
  return t.content.firstChild;
};
const spinner = () => $("span", { className: "spinner", ariaHidden: "true" });
const q = document.getElementById("q"), out = document.getElementById("out");
const post = async (url, body) => {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok) throw new Error(data.detail);
  return data;
};

// Text with every highlighted phrase wrapped in <mark>…</mark>, as a string (sent to the translator).
const withMarks = (text, phrases = []) =>
  [...new Set(phrases)].reduce((t, p) => t.split(p).join(`<mark>${p}</mark>`), text);
// That string as DOM nodes; never innerHTML, so article text cannot inject markup.
const marked = (s) => {
  let inMark = false;
  return s.split(/(<\/?mark>)/).flatMap((piece) => {
    if (piece === "<mark>" || piece === "</mark>") { inMark = piece === "<mark>"; return []; }
    return piece ? [inMark ? $("mark", { textContent: piece }) : piece] : [];
  });
};

// Search suggestions (a combobox): one per topic, from /api/titles, with the typed text underlined in
// the title. Arrow keys move through them, Enter or a click opens one in its edition, Escape closes.
const list = document.getElementById("suggestions");
let timer, suggested = [], active = -1;
const closeSuggestions = () => {
  list.hidden = true;
  q.ariaExpanded = "false";
  q.removeAttribute("aria-activedescendant");
  active = -1;
};
const underline = (title, typed) => {
  const i = title.toLowerCase().indexOf(typed.toLowerCase());
  return i < 0 ? [title] : [title.slice(0, i), $("u", { textContent: title.slice(i, i + typed.length) }), title.slice(i + typed.length)];
};
const choose = (s) => {
  closeSuggestions();
  const query = { title: s.title, lang: s.lang, page: 1, dialects: urlQuery().dialects };
  search(query, queryString(query) !== location.search.slice(1));
};
const highlight = (i) => {
  active = i;
  [...list.children].forEach((li, k) => { li.ariaSelected = String(k === i); });
  q.setAttribute("aria-activedescendant", list.children[i].id);
  list.children[i].scrollIntoView({ block: "nearest" });
};
q.addEventListener("input", () => {
  clearTimeout(timer);
  const typed = q.value.trim();
  if (typed.length < 2) return closeSuggestions();
  timer = setTimeout(async () => {
    let items;
    try { items = await (await fetch(`/api/titles?q=${encodeURIComponent(typed)}`)).json(); } catch { return; }
    if (q.value.trim() !== typed || !Array.isArray(items) || document.activeElement !== q) return;  // typed on, or left
    suggested = items;
    list.replaceChildren(...items.map((s, k) => {
      const li = $("li", { id: `suggestion-${k}`, role: "option", ariaSelected: "false" },
        $("span", { className: "thumb" }, /^https:\/\//.test(s.thumbnail || "") ? $("img", { src: s.thumbnail, alt: "", loading: "lazy" }) : icon("article")),
        $("span", { className: "text" },
          $("b", {}, ...underline(s.title, typed), s.lang !== "en" ? $("span", { className: "lang", textContent: s.lang }) : ""),
          s.description ? $("small", { textContent: s.description }) : ""));
      li.addEventListener("mousedown", (e) => e.preventDefault());  // keep the focus in the search field
      li.addEventListener("click", () => choose(s));
      return li;
    }));
    active = -1;
    list.hidden = !items.length;
    q.ariaExpanded = String(items.length > 0);
  }, 200);
});
q.addEventListener("keydown", (e) => {
  if (list.hidden) return;
  const n = suggested.length, down = e.key === "ArrowDown";
  if (down || e.key === "ArrowUp") {
    e.preventDefault();
    highlight(active < 0 ? (down ? 0 : n - 1) : (active + (down ? 1 : -1) + n) % n);
  } else if (e.key === "Enter" && active >= 0) {
    e.preventDefault();
    choose(suggested[active]);
  } else if (e.key === "Escape") closeSuggestions();
});
q.addEventListener("blur", closeSuggestions);

// The query lives in the URL (?title=…&lang=…&page=…&langs=fi,sv&dialects=0) so results can be shared
// and Back/Forward work; `lang` (the edition the title is from) comes from the extension's link. The
// title is only ever put into input.value, textContent and URLSearchParams: never parsed as HTML.
const PER_PAGE = 10;
let current = 0;
const urlQuery = () => {
  const p = new URLSearchParams(location.search);
  return { title: p.get("title")?.trim(), lang: p.get("lang"), page: Math.max(1, parseInt(p.get("page"), 10) || 1),
           langs: p.get("langs")?.split(",").filter(Boolean) || null, dialects: p.get("dialects") !== "0" };
};
// Only the parameters that differ from the defaults.
const params = ({ lang, langs, dialects }) => ({ ...(lang && { lang }), ...(langs && { langs: langs.join(",") }), ...(!dialects && { dialects: 0 }) });
const queryString = (query) => `${new URLSearchParams({ title: query.title, ...params(query), ...(query.page > 1 && { page: query.page }) })}`;
async function search(query, push) {
  const { title, page } = query;
  if (push) history.pushState(null, "", `?${queryString(query)}`);
  q.value = title;
  document.title = `${title} — WikiCross`;
  const mine = ++current;  // a slower, older search must not overwrite a newer one
  // Loading view: the server's current stage (fetching editions, embedding, comparing), polled each
  // second, and the time so far. Only the stage is announced to screen readers, not every second.
  const stage = $("span", { textContent: "Looking the topic up…" }), seconds = $("span", { className: "muted", ariaHidden: "true" });
  out.replaceChildren($("div", { className: "loading" }, spinner(),
    $("div", {}, $("div", { className: "stage", role: "status" }, stage, " ", seconds),
      $("div", { className: "muted", textContent: "The first time an article is asked for, all its Wikipedia versions are fetched and embedded: this may take a few minutes." }))));
  const poll = setInterval(async () => {
    try {
      const p = await (await fetch(`/api/progress?${new URLSearchParams({ title })}`)).json();
      if (mine !== current || !p.stage) return;
      if (stage.textContent !== `${p.stage}…`) stage.textContent = `${p.stage}…`;
      seconds.textContent = `${p.seconds} s`;
    } catch { /* the result itself reports errors */ }
  }, 1000);
  let r, data;
  try {
    r = await fetch(`/api/diff?${new URLSearchParams({ title, limit: PER_PAGE, offset: (page - 1) * PER_PAGE, ...params(query) })}`);
    data = await r.json().catch(() => ({ detail: `Server error ${r.status}` }));
  } catch (err) {
    data = { detail: `WikiCross server not reachable: ${err.message}` };
  } finally {
    clearInterval(poll);
  }
  if (mine !== current) return;
  if (!r?.ok) { out.replaceChildren($("p", { className: "error", textContent: data.detail })); return; }
  render({ data, query });
}

document.getElementById("f").addEventListener("submit", (e) => {
  e.preventDefault();
  closeSuggestions();
  // A typed title may be from any edition: no lang; another topic has other languages: no langs.
  const query = { title: q.value.trim(), page: 1, dialects: urlQuery().dialects };
  if (query.title) search(query, queryString(query) !== location.search.slice(1));
});
window.addEventListener("popstate", () => { const query = urlQuery(); if (query.title) search(query, false); });
if (urlQuery().title) search(urlQuery(), false);

// Every edition, folded into a menu: a topic can have dozens. Each link opens that edition.
function editionsMenu(articles) {
  return $("details", { className: "editions" },
    $("summary", { textContent: `${articles.length} editions` }),
    $("div", { className: "langs" }, ...articles.map((a) => $("a", { href: /^https?:\/\//.test(a.url) ? a.url : "#", target: "_blank", rel: "noopener" },
      $("b", { textContent: `${langName(a.lang)} (${a.lang})` }), ` · ${a.title}`))));
}

// Which editions are compared: a language picker (Apply runs the search again; the server compares
// only those) and a quick "Hide dialects" (editions without a two-letter code).
function filters(languages, query) {
  const sorted = [...languages].sort((a, b) => langName(a).localeCompare(langName(b)));
  const chosen = new Set(query.langs || languages);
  const boxes = sorted.map((l) => $("input", { type: "checkbox", value: l, checked: chosen.has(l) }));
  const button = (text, onClick, primary) => {
    const b = $("button", { className: `btn small${primary ? " primary" : ""}`, type: "button", textContent: text });
    b.addEventListener("click", onClick);
    return b;
  };
  const apply = button("Apply", () => {
    const langs = boxes.filter((b) => b.checked).map((b) => b.value);
    search({ ...query, langs: langs.length === languages.length ? null : langs, page: 1 }, true);
  }, true);
  const update = () => { apply.disabled = boxes.filter((b) => b.checked).length < 2; };  // a comparison needs two
  const all = (on) => { boxes.forEach((b) => { b.checked = on; }); update(); };
  boxes.forEach((b) => b.addEventListener("change", update));
  const picker = $("details", { className: "editions picker" },
    $("summary", { textContent: query.langs ? `Languages: ${query.langs.length} of ${languages.length}` : `Languages: all ${languages.length}` }),
    $("div", { className: "langs" },
      $("div", { className: "actions" }, button("All", () => all(true)), button("None", () => all(false)), apply),
      ...boxes.map((b) => $("label", {}, b, ` ${langName(b.value)} (${b.value})`))));
  const dialects = $("input", { type: "checkbox", checked: !query.dialects });
  dialects.addEventListener("change", () => search({ ...query, dialects: !dialects.checked, page: 1 }, true));
  return $("div", { className: "filters" }, picker, $("label", { className: "toggle" }, dialects, "Hide dialects"));
}

function render({ data, query }) {
  const head = data.articles.find((a) => a.lang === "en") || data.articles[0];
  const pages = Math.ceil(data.total / PER_PAGE), from = (query.page - 1) * PER_PAGE;
  // Findings the AI check does not confirm leave the list for a hidden one under it, behind a button.
  const irrelevant = $("div", { className: "irrelevant", hidden: true });
  const reveal = $("button", { className: "btn small", type: "button", hidden: true, ariaExpanded: "false" });
  let dismissed = 0;
  const relabel = () => reveal.replaceChildren(icon("eye"),
    `${irrelevant.hidden ? "Show" : "Hide"} ${dismissed} finding${dismissed === 1 ? "" : "s"} the AI marked as irrelevant`);
  reveal.addEventListener("click", () => {
    irrelevant.hidden = !irrelevant.hidden;
    reveal.ariaExpanded = String(!irrelevant.hidden);
    relabel();
  });
  const dismiss = (article) => { dismissed++; irrelevant.append(article); reveal.hidden = false; relabel(); };
  const go = (page) => { search({ ...query, page }, true); window.scrollTo(0, 0); };
  const step = (page, text, iconName) => {
    const b = $("button", { className: "btn small", type: "button", disabled: page < 1 || page > pages }, ...(iconName === "left" ? [icon(iconName), text] : [text, icon(iconName)]));
    b.addEventListener("click", () => go(page));
    return b;
  };
  const pager = pages > 1 ? $("nav", { className: "pager", ariaLabel: "Pages of differences" },
    step(query.page - 1, "Previous", "left"), $("span", { textContent: `Page ${query.page} of ${pages}` }), step(query.page + 1, "Next", "right")) : "";
  out.replaceChildren(
    $("div", { className: "pagehead" }, $("h1", { textContent: head.title }), editionsMenu(data.articles)),
    filters(data.languages, query),
    ...(data.total ? [
      $("h2", { textContent: `${data.total} differences` }),
      $("p", { className: "muted", textContent: `Strongest first. Showing ${from + 1}–${from + data.differences.length}.` }),
      ...data.differences.map((f) => card(f, dismiss)), reveal, irrelevant, pager]
      : [$("p", { className: "muted", textContent: "The editions state nothing differently that WikiCross can find." })]));
}

const getContext = async (params) => {
  const r = await fetch(`/api/context?${new URLSearchParams(params)}`);
  const data = await r.json();
  if (!r.ok) throw new Error(data.detail);
  return data;
};

// Paragraph view only ("Show paragraphs"), and only in the web app: when a quote's whole passage is
// not enough context, it expands up and down through the article, a few sentences per click, like
// the folded lines of a GitHub diff. Context is muted; a new passage starts a new line, a new section
// shows its heading. `ctx` outlives re-renders of the card; `quote()` gives fresh nodes for the passage.
const STEP = 3;
const contextOf = (m) => ({ before: [], after: [], top: [m.seq, 0], bottom: [m.seq, 65535], end: {}, busy: false, error: "" });
function expandable(m, ctx, quote) {
  const wrap = $("div", { className: "expandable" });
  const button = (dir) => {
    if (ctx.end[dir]) return "";
    const b = $("button", { className: "expand", type: "button", disabled: ctx.busy, title: `Show ${STEP} more sentences ${dir === "up" ? "above" : "below"}` },
      icon(dir === "up" ? "up" : "chevron"), dir === "up" ? "Expand up" : "Expand down");
    b.addEventListener("click", async () => {
      ctx.busy = true; draw();
      const [seq, n] = dir === "up" ? ctx.top : ctx.bottom;
      try {
        const rows = await getContext({ lang: m.lang, page_id: m.page_id, seq, n, direction: dir, count: STEP });
        if (rows.length) {
          if (dir === "up") { ctx.before.unshift(...rows); ctx.top = [rows[0].seq, rows[0].n]; }
          else { ctx.after.push(...rows); ctx.bottom = [rows.at(-1).seq, rows.at(-1).n]; }
        }
        ctx.end[dir] = rows.length < STEP;
        ctx.error = "";
      } catch (err) { ctx.error = `Could not load more: ${err.message}`; }
      ctx.busy = false; draw();
    });
    return b;
  };
  const draw = () => {
    const segments = [...ctx.before.map((r) => ({ ...r, nodes: [r.text] })), { seq: m.seq, heading: m.heading, nodes: quote(), quote: true },
      ...ctx.after.map((r) => ({ ...r, nodes: [r.text] }))];
    const body = $("blockquote", {});
    segments.forEach((s, i) => {
      const prev = segments[i - 1];
      if (prev && s.heading !== prev.heading) body.append("\n", $("span", { className: "section", textContent: `§ ${s.heading || "(intro)"}` }), "\n");
      else if (prev) body.append(s.seq !== prev.seq ? "\n" : " ");
      body.append($("span", { className: s.quote ? "quoted" : "context" }, ...s.nodes));
    });
    wrap.replaceChildren(button("up"), body, button("down"), ctx.error ? $("p", { className: "error", textContent: ctx.error }) : "");
  };
  draw();
  return wrap;
}

// A quote's place on its Wikipedia page, as a text fragment the browser scrolls to and highlights. Only
// its first and last words: the rendered page puts footnote marks ([12]) inside sentences. Keep in sync
// with extension/content.js. The end stops at the last word's full stop, without the punctuation at
// either end: many editions put footnote marks before the full stop ("…Энкеля»[4]."), and a mark after
// it comes as glued text ("tilauksesta.lähde?" for "tilauksesta.[lähde?]"), neither as on the page.
const snippetUrl = (m) => {
  const words = m.sentence.trim().replace(/[.!?]\S*$/u, "").replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, "").split(/\s+/);
  const enc = (w) => encodeURIComponent(w.join(" ")).replace(/-/g, "%2D");
  const text = words.length <= 6 ? enc(words) : `${enc(words.slice(0, 3))},${enc(words.slice(-3))}`;
  return `https://${m.lang}.wikipedia.org/wiki/${encodeURIComponent(m.title.replace(/ /g, "_"))}#:~:text=${text}`;
};

// The numbers behind a finding, in a small window (a popover: a click outside or Escape closes it).
// Keep in sync with extension/content.js.
let anchors = 0;  // each "i" is the anchor its popover is placed by
function numbers(f) {
  const sigma = (d) => { const r = Math.round(d * 10) / 10; return `${r > 0 ? "+" : r < 0 ? "−" : ""}${Math.abs(r).toFixed(1)}σ`; };
  const rows = Object.entries(f.deviations || {}).sort((a, b) => b[1] - a[1]);
  const box = $("div", { className: "numbers", popover: "auto" },
    $("h4", { textContent: `How far apart: the ${f.axis} axis` }),
    $("p", { textContent: `Each sentence has a position on this axis: towards +, an edition ${f.ends[0]}; towards −, it ${f.ends[1]}. `
      + "Positions are measured against the language's own sentences, so 1σ is a typical spread within that language." }),
    $("p", { textContent: `${langName(f.lang)} sits ${sigma(f.deviations?.[f.lang] ?? f.deviation)} from the average of the others; a finding needs at least 1.2σ either way. Each edition, from its others' average:` }),
    $("table", {}, ...rows.map(([l, d]) => $("tr", { className: l === f.lang ? "this" : "" },
      $("td", { textContent: langName(l) }), $("td", { className: "num", textContent: sigma(d) })))),
    $("p", { className: "muted", textContent: `The sentences are matched as one statement: their largest cosine distance is ${f.distance.toFixed(2)} `
      + "(0 is the same meaning; up to 0.35 counts)." }));
  const anchor = `--numbers-${++anchors}`;
  box.style.positionAnchor = anchor;
  const info = $("button", { className: "info", type: "button", popoverTargetElement: box, title: "The numbers behind this finding",
                             ariaLabel: "The numbers behind this finding" }, icon("info"));
  info.style.anchorName = anchor;
  return [info, box];
}

// An open menu (editions, "+N more") closes on a click outside it, or on Escape.
const closeMenus = (target) => { for (const d of document.querySelectorAll("details.editions[open]")) if (!d.contains(target)) d.open = false; };
document.addEventListener("click", (e) => closeMenus(e.target));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenus(null); });

// Which quote each highlighted part of the description comes from: it takes that quote's colour (c0…c3,
// by the quote's place in `members`), names it on hover, and outlines the quote box meanwhile. Matched by
// the quotes' marked words, exactly, then by containment; an unmatched part keeps the plain highlight.
// Keep in sync with extension/content.js.
function linkQuotes(summary, members, state, quotes) {
  const norm = (s) => s.trim().toLowerCase();
  const marksOf = (p) => [...(state.english[p.lang]?.quote || "").matchAll(/<mark>(.*?)<\/mark>/gs)].map((m) => norm(m[1]))
    .concat((state.phrases[p.lang] || []).map(norm));
  const seen = {};  // a phrase in several quotes: its n-th mention goes to the n-th quote holding it
  for (const mark of summary.querySelectorAll("mark")) {
    const text = norm(mark.textContent);
    let holders = members.map((p, k) => (marksOf(p).includes(text) ? k : -1)).filter((k) => k >= 0);
    if (!holders.length) holders = members.map((p, k) => (marksOf(p).some((t) => t.includes(text) || text.includes(t)) ? k : -1)).filter((k) => k >= 0);
    if (!holders.length) continue;
    const i = holders[(seen[text] = (seen[text] ?? -1) + 1) % holders.length];
    const p = members[i], box = () => quotes.querySelector(`.quote[data-lang="${p.lang}"]`);
    mark.className = `c${i % 4}`;
    mark.title = `From the ${langName(p.lang)} quote`;
    mark.addEventListener("mouseenter", () => box()?.classList.add("linked"));
    mark.addEventListener("mouseleave", () => box()?.classList.remove("linked"));
  }
}

const KIND_NAMES = { factual: "Factual disagreement", bias: "Bias", framing: "Framing" };  // app.py KINDS

// A finding. The AI (one /api/explain call for the quotes on show) gives its title, a description
// quoting the framing words, and each quote in English with those words marked; the original keeps the
// same words marked. Quotes show in English; each one's translate button shows the original on hover
// and swaps to it on click. Quotes beyond the first SHOWN, and paragraphs, are translated when shown.
function card(finding, dismiss) {
  const state = { english: {}, phrases: {}, original: new Set(), aiDone: false, translating: false, translateError: "",
                  passages: {}, passagesBusy: false, passagesError: "", context: false, all: false,
                  ctx: Object.fromEntries(finding.members.map((m) => [m.lang, contextOf(m)])) };
  const outliers = finding.outlier ? [finding.lang] : [];
  // The kind badge waits for the AI; the label only says which edition is the outlier, if one is.
  const kind = $("span", { className: "kind", hidden: true });
  const label = $("span", { className: "score" },
    finding.outlier ? `Outlier: ${langName(finding.lang)}` : "", ...numbers(finding));
  // Outliers first, then the API's order; a card shows the first SHOWN unless expanded.
  const members = [...finding.members.filter((m) => outliers.includes(m.lang)), ...finding.members.filter((m) => !outliers.includes(m.lang))];
  const first = members.slice(0, SHOWN);
  const title = $("h3", { className: "pending" }, spinner(), "Asking the AI how they differ…");
  const summary = $("p", { className: "summary" });
  const verdict = $("p", { className: "verdict" });  // why the AI marked it irrelevant, or why it failed
  const quotes = $("div", { className: "quotes" });
  const article = $("article", { className: "card" });
  const more = members.length > SHOWN ? $("button", { className: "btn small", type: "button" }) : null;

  // Quotes the AI call does not cover (beyond the first SHOWN, or all if it failed), in one call.
  const translateQuotes = async (pool) => {
    const todo = pool.filter((p) => !state.english[p.lang] && (state.aiDone || !first.includes(p)));
    if (!todo.length || state.translating) return;
    state.translating = true;
    const texts = {};
    for (const p of todo) {
      texts[p.lang] = p.sentence;
      if (p.heading) texts[`${p.lang}-heading`] = p.heading;
    }
    try {
      const t = await post("/api/translate", { texts, target: "en" });
      for (const p of todo) state.english[p.lang] = { quote: t[p.lang], heading: t[`${p.lang}-heading`] ?? p.heading };
      state.translateError = "";
    } catch (err) { state.translateError = `Could not translate: ${err.message}`; }
    state.translating = false;
    renderQuotes();
  };
  // Paragraphs in English: the passages translated, the quote marked in them.
  const translatePassages = async (pool) => {
    const todo = pool.filter((p) => !(p.lang in state.passages));
    if (!todo.length || state.passagesBusy) return;
    state.passagesBusy = true;
    try {
      Object.assign(state.passages, await post("/api/translate", { texts: Object.fromEntries(todo.map((p) => [p.lang, withMarks(p.text, [p.sentence])])), target: "en" }));
      state.passagesError = "";
    } catch (err) { state.passagesError = `Could not translate the paragraphs: ${err.message}`; }
    state.passagesBusy = false;
    renderQuotes();
  };

  // The translate button of a quote: its popup shows the version not on show; a click swaps them.
  const swap = (p, en, english, original) => {
    if (p.lang === "en") return "";
    if (!state.english[p.lang]) {
      const busy = !state.aiDone || state.translating;
      return busy ? $("span", { className: "pending", title: "Translating…" }, spinner()) : "";
    }
    const button = $("button", { type: "button", ariaPressed: String(!en),
      ariaLabel: en ? `Show the original ${langName(p.lang)} quote` : "Show the English translation" }, icon("translate"));
    button.dataset.lang = p.lang;
    button.addEventListener("click", () => {
      if (!state.original.delete(p.lang)) state.original.add(p.lang);
      renderQuotes();
      quotes.querySelector(`button[data-lang="${p.lang}"]`)?.focus();  // the re-render replaced it
    });
    return $("span", { className: "tr" }, button,
      $("div", { className: "tip", role: "tooltip" },
        $("div", { className: "section", textContent: en ? `Original (${langName(p.lang)})` : "English translation" }),
        ...(en ? original() : english())));
  };

  const renderQuotes = () => {
    const pool = state.all ? members : first;
    translateQuotes(pool);
    if (more) more.replaceChildren(icon("list"), state.all ? "Show fewer" : `Show all ${members.length} editions`, icon(state.all ? "up" : "chevron"));
    const english = (p) => state.english[p.lang] && !state.original.has(p.lang);
    // A hidden finding (marked irrelevant) shows its paragraphs in the original: not worth a translation.
    if (state.context && !state.dismissed) translatePassages(pool.filter(english));
    quotes.replaceChildren(...pool.map((p) => {
      const en = english(p);
      const englishQuote = () => marked(state.english[p.lang].quote);
      const originalQuote = () => marked(withMarks(p.sentence, state.phrases[p.lang]));
      const passage = state.passages[p.lang];
      const quote = state.context && en && !state.dismissed
        ? $("blockquote", {}, ...(passage ? [$("span", { className: "quoted" }, ...marked(passage))]
            : state.passagesError ? [$("span", { className: "error", textContent: state.passagesError })]
            : [spinner(), "Translating the paragraphs…"]))
        : state.context ? expandable(p, state.ctx[p.lang], () => marked(withMarks(p.text, [p.sentence])))
        : $("blockquote", {}, $("span", { className: "quoted" }, ...(en ? englishQuote() : originalQuote())));
      const heading = (en ? state.english[p.lang].heading : p.heading) || "(intro)";
      const open = $("a", { className: "open", href: snippetUrl(p), target: "_blank", rel: "noopener",
                            title: `Open this quote on Wikipedia: ${p.title}`, ariaLabel: `Open this quote on ${langName(p.lang)} Wikipedia` }, icon("link"));
      const i = members.indexOf(p);
      const box = $("div", { className: `quote c${i % 4}${outliers.includes(p.lang) ? " outlier" : ""}` },
        $("h4", {}, $("b", { textContent: langName(p.lang) }), $("span", { className: "muted", textContent: `§ ${heading}` }), open),
        quote, $("div", { className: "foot" }, swap(p, en, englishQuote, originalQuote)));
      box.dataset.lang = p.lang;
      return box;
    }), ...(state.translateError ? [$("p", { className: "error", textContent: state.translateError })] : []));
  };

  post("/api/explain", { passages: first.map((p) => ({ lang: p.lang, heading: p.heading || "", text: p.text, sentence: p.sentence })) })
    .then((x) => {
      title.className = "";
      title.textContent = x.title;
      if (x.discrepancy && x.kind) Object.assign(kind, { className: `kind ${x.kind}`, textContent: KIND_NAMES[x.kind], hidden: false });
      if (!x.discrepancy) Object.assign(kind, { className: "kind none", textContent: "Irrelevant", hidden: false });
      for (const [lang, q] of Object.entries(x.quotes)) {
        state.english[lang] = { quote: q.english, heading: q.heading };
        state.phrases[lang] = q.phrases;
      }
      summary.replaceChildren(...marked(x.description));
      linkQuotes(summary, members, state, quotes);
      if (!x.discrepancy) {
        // Why it is out of the list; the description says what each edition states.
        verdict.className = "verdict reason";
        verdict.textContent = "Marked irrelevant by the AI check: these passages neither disagree on facts nor "
          + "differ clearly in tone or framing. Their distance on the axis comes from other differences, such "
          + "as what they include, their length or detail.";
        state.dismissed = true;
        dismiss(article);
      }
    })
    .catch((err) => {
      title.remove();
      verdict.className = "error";
      verdict.textContent = `AI unavailable, quotes in their original language: ${err.message}`;
    })
    .finally(() => { state.aiDone = true; renderQuotes(); });
  renderQuotes();

  const tools = $("div", { className: "tools" });
  if (more) {
    more.addEventListener("click", () => { state.all = !state.all; renderQuotes(); });
    tools.append(more);
  }
  const context = $("button", { className: "btn small", type: "button" }, icon("paragraph"), "Show paragraphs", icon("chevron"));
  context.addEventListener("click", () => {
    state.context = !state.context;
    context.replaceChildren(icon("paragraph"), state.context ? "Show sentences" : "Show paragraphs", icon(state.context ? "up" : "chevron"));
    renderQuotes();
  });
  tools.append(context);

  article.append(
    $("div", { className: "meta" }, kind, label),
    title, verdict, summary, quotes, tools);
  return article;
}
</script>
</body>
</html>
